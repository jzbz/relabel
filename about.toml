# cargo-about configuration for the third-party notice file that ships with a
# release. Run it through packaging/third-party-notices.sh, not directly: the
# script adds the checks cargo-about's own --fail does not make. See
# THIRD-PARTY.md.
#
# This produces text; deny.toml decides what is allowed.

# Priority order matters: where a crate offers a choice, the first licence here
# that satisfies its expression is the one whose text is reproduced. MIT and the
# BSD licences come first because their texts carry the copyright line, which
# Apache-2.0's own text does not.
accepted = [
    "MIT",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "Unicode-3.0",
    # Unused by the current graph - every Apache-2.0 crate also offers MIT or
    # BSD-3-Clause - and needed once datamatrix brings flagset, which is
    # Apache-2.0 only.
    "Apache-2.0",
]

# The desktop platforms a release is built for, kept identical to deny.toml's
# list. Dependencies behind a cfg() matching none of these - WASM, Android,
# Redox - are left out.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

# The notices describe what is inside the shipped binary: build scripts and
# test-only crates are not.
ignore-build-dependencies = true
ignore-dev-dependencies = true
ignore-transitive-dependencies = false

# Scan only a crate's root and one directory below it, which is where a
# REUSE-style LICENSES/ directory lives. Unbounded, cargo-about reads every
# source file and takes licence *headers* for licence texts: moxcms and pxfm
# then contribute 27 spurious BSD-3-Clause "texts" that are Rust source, and
# libdbus-sys a header from vendored C that is never compiled. Depth 2 removes
# exactly those and nothing else. The key is in cargo-about's config.rs but
# not its book.
max-depth = 2

# Workspace members with `publish = false` (relabel-cli) are not listed.
private = { ignore = true }

# ---------------------------------------------------------------------------
# Clarifications. Each is pinned by SHA-256 - of the whole file, or of the text
# from `start` to `end` where those are given. When a dependency update changes
# a pinned file, the clarification stops applying, the notices script fails,
# and the checksum is re-derived after reading the new text.
# ---------------------------------------------------------------------------

# relabel's own library crates: path dependencies with no licence file in the
# crate directory. Point them at the repository's LICENSE.
[relabel-proto.clarify]
license = "MIT"
[[relabel-proto.clarify.files]]
path = "../../LICENSE"
checksum = "c92c8f2a8f2f56d1a114a18c06dc18277f2d0eeedea3101205fed407c617e0fe"

[relabel-render.clarify]
license = "MIT"
[[relabel-render.clarify.files]]
path = "../../LICENSE"
checksum = "c92c8f2a8f2f56d1a114a18c06dc18277f2d0eeedea3101205fed407c617e0fe"

[relabel-core.clarify]
license = "MIT"
[[relabel-core.clarify.files]]
path = "../../LICENSE"
checksum = "c92c8f2a8f2f56d1a114a18c06dc18277f2d0eeedea3101205fed407c617e0fe"

# btleplug declares "MIT/Apache-2.0/BSD-3-Clause", but its LICENSE.md says the
# crate is BSD-3-Clause (Nonpolynomial) with parts forked from Rumble
# (MIT/Apache-2.0) and blurmac (BSD-3-Clause). Taken as a conjunction so all
# three copyright notices are reproduced.
[btleplug.clarify]
license = "BSD-3-Clause AND MIT"
[[btleplug.clarify.files]]
path = "LICENSE.md"
license = "BSD-3-Clause"
start = "Copyright (c) 2020-2021, Nonpolynomial"
end = "SUCH DAMAGE."
checksum = "694857dfd4f6e99850e95c221fb9779525a58aec777c76f0471b9a2d7d188a3f"
[[btleplug.clarify.files]]
path = "LICENSE.md"
license = "MIT"
start = "Copyright (c) 2014 The Rust Project Developers"
end = "DEALINGS IN THE SOFTWARE."
checksum = "14435fbcd271e2783f721b57b7bf4f6502c1379249a4300e0e5bb774686c2d90"
[[btleplug.clarify.files]]
path = "LICENSE.md"
license = "BSD-3-Clause"
start = "Copyright (c) 2017 Akos Kiss"
end = "SUCH DAMAGE."
checksum = "e16bad27d78734873a3632c5838e243e36fed6e8f55f453f8e43d1e4e84d1506"

# bluez-async and bluez-generated ship no licence files in their packages. The
# texts are fetched from the repository at the commit each crate was published
# from, which is why generating the notices needs the network.
[bluez-async.clarify]
license = "MIT OR Apache-2.0"
[[bluez-async.clarify.git]]
path = "LICENSE-MIT"
license = "MIT"
checksum = "eef0c0b2cf6e14147a8362cfa2408a79220cc1ea22bab1a2e188b9cd1d2e0f0d"

[bluez-generated.clarify]
