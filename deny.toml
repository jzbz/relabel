# Licence policy, enforced by `cargo deny check licenses`.
#
# This is the gate, not the notice file. It fails the moment a dependency
# arrives under a licence nobody has approved, so a new licence is a reviewed
# change to this file rather than something discovered in a release. The
# attribution that ships with a binary is generated separately; see
# THIRD-PARTY.md.

[graph]
# The desktop platforms relabel is built for, kept identical to about.toml's
# list. A crate reachable only from another target (Android's jni, WASI,
# Redox) never ships and is not checked.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
# Only what ships. Test-only crates, such as the independent decoders the
# renderer's tests read symbols back with, never reach a user.
exclude-dev = true

[licenses]
# An OR expression passes when any one branch is allowed, so MIT alone covers
# every "MIT OR Apache-2.0" crate. Each other entry is here because some
# shipped crate offers no MIT branch, and each was confirmed necessary by
# removing it and watching the check fail.
allow = [
    "MIT",
    "BSD-2-Clause", # arrayref, via tiny-skia
    # tiny-skia and tiny-skia-path; moxcms and pxfm offer it or Apache-2.0.
    "BSD-3-Clause",
    "Unicode-3.0",  # unicode-ident: (MIT OR Apache-2.0) AND Unicode-3.0
]
# Apache-2.0 is deliberately absent from the list above. An Apache-only crate
# is admitted by name, below, so the next one still fails the check - and
# Apache-2.0 carries NOTICE and patent terms MIT does not. Copyleft - MPL,
# LGPL, GPL - is absent on purpose too; see THIRD-PARTY.md for what each would
# require.
exceptions = [
    # --- the GUI toolkit, and the window and accessibility stack under it ---
    # Slint offers GPL-3.0-only, its royalty-free licence, or a commercial one.
    # relabel takes the royalty-free branch: it permits a desktop application
    # under any licence, which is what this is. See THIRD-PARTY.md.
    { crate = "slint", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "slint-build", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "slint-macros", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "i-slint-common", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "i-slint-compiler", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "i-slint-core", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "i-slint-core-macros", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "i-slint-backend-selector", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "i-slint-backend-winit", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "i-slint-renderer-software", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    # The window and accessibility stack winit brings, Apache-2.0 only.
    { crate = "winit", allow = ["Apache-2.0"] },
    { crate = "accesskit_winit", allow = ["Apache-2.0"] },
    { crate = "gethostname", allow = ["Apache-2.0"] },
    # Text measurement inside the software renderer.
    { crate = "ab_glyph", allow = ["Apache-2.0"] },
    { crate = "ab_glyph_rasterizer", allow = ["Apache-2.0"] },
    { crate = "owned_ttf_parser", allow = ["Apache-2.0"] },
    { crate = "unicode-linebreak", allow = ["Apache-2.0"] },
    { crate = "linked_hash_set", allow = ["Apache-2.0"] },
    # A conjunction, not a choice: both licences apply at once, so MIT alone
    # cannot admit it.
    { crate = "dpi", allow = ["Apache-2.0", "MIT"] },
    { crate = "imgref", allow = ["CC0-1.0"] },
    { crate = "libloading", allow = ["ISC"] },
    { crate = "slotmap", allow = ["Zlib"] },
    # winit's clipboard, on the Boost licence.
    { crate = "clipboard-win", allow = ["BSL-1.0"] },
    { crate = "error-code", allow = ["BSL-1.0"] },
    # --- everything below predates the GUI ---
    # Via datamatrix, for DataMatrix symbols. No NOTICE file.
    { crate = "flagset", allow = ["Apache-2.0"] },
    # Via hashbrown's default hasher, which parley and fontique ask for.
    { crate = "foldhash", allow = ["Zlib"] },
]
