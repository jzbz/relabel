[workspace]
resolver = "3"
# Members are added as they gain a manifest; the layout the design calls for is
# proto -> render -> core -> gui, plus a cli used only for hardware bring-up.
members = [
    "crates/relabel-proto",
    "crates/relabel-render",
    "crates/relabel-core",
    "crates/relabel-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# What cargo will actually enforce, not what the edition alone asks for. The
# edition's own floor is 1.85, but slint 1.17 declares 1.92 throughout its tree
# and cargo enforces the maximum over the whole graph. relabel-proto carries no
# Slint dependency and still checks on 1.85; relabel-render needs 1.88, the
# floor fontique and ICU4X declare. The toolkit is the rest of the difference,
# exactly as it is in rpgp.
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/jzbz/relabel"

[workspace.dependencies]
relabel-proto = { path = "crates/relabel-proto" }
relabel-render = { path = "crates/relabel-render" }
relabel-core = { path = "crates/relabel-core" }

# Error enums in every crate. No runtime cost, and it keeps the cores returning
# typed errors that the GUI can match on rather than strings it has to parse.
thiserror = "2"
# GUI and CLI only. The library crates never return anyhow::Error - a caller
# needs to be able to tell "printer said cover open" from "the socket died".
anyhow = "1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# btleplug needs a tokio runtime, and a print job is a multi-second streaming
# session with live progress rather than a short request/response - so the
# runtime lives on its own thread and the GUI hears about it through the Slint
# event loop, never by blocking on it.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
# Trait objects. Native async-fn-in-trait is stable, but it is not dyn
# compatible, and `Box<dyn Transport>` is the whole point of the abstraction:
# BLE, serial and the replay transport have to be interchangeable at runtime.
async-trait = "0.1"

# CPU rasteriser, pure Rust, BSD-3-Clause. 0.12 rather than 0.11: 0.11.4 panics
# in its anti-aliased hairline scan near a pixmap edge, and a barcode bar on a
# 96-dot label is exactly that case - in a debug build, which is what
# `cargo test` is. `default-features = false` drops the PNG codec it would
# otherwise pull for its own tests; `image` handles files.
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }

# Code 128 with the character-set switching done for us, and done well: its
# encoder matched a provably optimal one on all of 30 000 sampled printable-ASCII
# payloads, and choosing the switches badly costs a quarter more label on a
# device whose whole label is 320 dots. It also ships an ISO/IEC 15417 decoder,
# which is what lets the tests read a rendered symbol back instead of trusting
# it. MIT OR Apache-2.0; its one dependency is `thiserror`, already here.
# Default features off drops only a Unicode block-art renderer.
code128 = { version = "0.2.1", default-features = false, features = ["std"] }
# Code 39, ITF, EAN-13 and EAN-8. Default features off drops its ASCII, JSON
# and SVG generators and an optional `image` dependency; `std` stays on or its
# error type loses its `std::error::Error` impl. Two of its behaviours are
# fenced off in `relabel-render`'s barcode module, and neither its Codabar nor
# its Code 93 is used: both have wrong entries in their tables.
barcoders = { version = "2.0", default-features = false, features = ["std"] }
# QR. With default features off it has no dependencies at all; the defaults
# pull `image` and two vector renderers relabel does not use. Micro QR is never
# requested: in 0.14.1 a Micro version can underflow and panic, in release
# builds too, and `relabel-render` has a test that keeps its code from naming
# one.
qrcode = { version = "0.14.1", default-features = false }
# DataMatrix, including the DMRE rectangles, which suit a long, narrow label.
# no_std + alloc; brings `arrayvec` and `flagset`, the latter Apache-2.0 only
# (see THIRD-PARTY.md). Three of its behaviours are fenced off in
# `relabel-render`'s code2d module.
datamatrix = "0.3.3"

# Text layout: shaping (harfrust), line breaking and bidi (ICU4X), and font
# selection (fontique, reached as parley::fontique). Default features off
# drops fontique's system-font backends - fontconfig, DirectWrite, CoreText -
# so relabel-render never enumerates or links a system font and a label
# rasterises the same everywhere. `complex-scripts` stays off too: it swaps in
# ICU's dictionary and LSTM segmenters for Thai, Lao, Khmer, Myanmar and CJK,
# which the embedded faces cannot draw, and adds 3.8 MB to a release binary.
parley = { version = "0.10", default-features = false, features = ["std"] }
# Glyph outlines and hinting: the autohinter here is the only hinting measured
# to keep a one-to-two-dot stem the same width across a glyph. See
# relabel-render's text module. The version parley 0.10 resolves to.
skrifa = "0.42.1"

# Test-only decoders, so a rendered symbol is read back by code that shares
# nothing with the encoder that made it. rqrr is a port of quirc. rxing is a
# port of ZXing: the only pure-Rust DataMatrix decoder found that shares no
# code with the encoder, and a second QR reader - one that, unlike rqrr, reads
# a Kanji-mode segment as the Shift JIS the standard says it is. Neither ships
# in a binary.
rqrr = { version = "0.11", default-features = false }
rxing = { version = "0.9", default-features = false, features = ["decoders", "datamatrix", "qrcode", "encoding_rs"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = "debuginfo"
